[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud_gnn"
version = "0.1.0"
description = "Graph-based fraud detection on Elliptic Bitcoin and SAML-D — thesis project"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torch-geometric",
    "scikit-learn",
    "pandas",
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
